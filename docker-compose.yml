services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Europe/Skopje
    expose:
      - "8191"
    volumes:
      - flaresolverr-config:/config
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8191', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    depends_on:
      flaresolverr:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Skopje"
      AUTO_UPDATE: "true"
    ports:
      - "9117:9117"
    volumes:
      - jackett-config:/config
      - jackett-downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9117/UI/Dashboard"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  flaresolverr-config:
  jackett-config:
  jackett-downloads:

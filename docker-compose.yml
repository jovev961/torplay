services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Skopje"
      AUTO_UPDATE: "true"
    ports:
      - "9117:9117"
    volumes:
      - jackett-config:/config
      - jackett-downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9117/UI/Dashboard"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  jackett-config:
  jackett-downloads:

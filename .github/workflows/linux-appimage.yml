name: Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test Linux x86_64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream cpio policykit-1 rpm zenity
          npm ci

      - name: Test, lint, build, and package
        run: npm run release:linux

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist/linux
          sha256sum --check TorPlay-*.AppImage.sha256
          sha256sum --check TorPlay-*.deb.sha256
          sha256sum --check TorPlay-*.rpm.sha256
          dpkg-deb --info TorPlay-*.deb
          rpm -qip TorPlay-*.rpm
          test -z "$(rpm -qp --scripts TorPlay-*.rpm)"

      - name: Smoke-test bundled runtime without FUSE
        shell: bash
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          node scripts/smoke-linux-appimage.js dist/linux/TorPlay-*.AppImage

      - name: Smoke-test RPM payload
        shell: bash
        run: |
          set -euo pipefail
          rpm_root=$(mktemp -d)
          trap 'rm -rf "$rpm_root"' EXIT
          (cd "$rpm_root" && rpm2cpio "$GITHUB_WORKSPACE"/dist/linux/TorPlay-*.rpm | cpio -idm)
          test -x "$rpm_root/usr/bin/torplay-uninstaller"
          test -f "$rpm_root/usr/share/applications/torplay-uninstaller.desktop"
          appstreamcli validate --no-net "$rpm_root/usr/share/metainfo/io.github.jovev961.TorPlay.metainfo.xml"
          node scripts/smoke-linux-appimage.js --installed "$rpm_root/usr/bin/torplay"

      - name: Verify Fedora RPM install, remove, and exact reinstall
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$GITHUB_WORKSPACE/dist/linux:/packages:ro" fedora:44 bash -lc '
            set -euo pipefail
            dnf --setopt=install_weak_deps=False install -y /packages/TorPlay-*.rpm
            rpm -q torplay
            test -x /usr/bin/torplay-uninstaller
            test -f /usr/share/applications/torplay-uninstaller.desktop
            dnf remove -y torplay
            ! rpm -q torplay
            dnf --setopt=install_weak_deps=False install -y /packages/TorPlay-*.rpm
            rpm -q torplay
            dnf remove -y torplay
            ! rpm -q torplay
          '

      - name: Install and smoke-test Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/linux/TorPlay-*.deb
          autostart_root=$(mktemp -d)
          trap 'sudo dpkg -r torplay >/dev/null 2>&1 || true; rm -rf "$autostart_root"' EXIT
          test -x /usr/bin/torplay-uninstaller
          test -f /usr/share/applications/torplay-uninstaller.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.jovev961.TorPlay.metainfo.xml
          XDG_CONFIG_HOME="$autostart_root" torplay-autostart enable
          test -f "$autostart_root/autostart/torplay.desktop"
          XDG_CONFIG_HOME="$autostart_root" torplay-autostart disable
          test ! -e "$autostart_root/autostart/torplay.desktop"
          node scripts/smoke-linux-appimage.js --installed /usr/bin/torplay
          sudo dpkg -r torplay
          test ! -e /usr/bin/torplay
          sudo dpkg -i dist/linux/TorPlay-*.deb
          dpkg-query --show --showformat='${db:Status-Status}\n' torplay | grep -qx installed
          node scripts/smoke-linux-appimage.js --installed /usr/bin/torplay
          sudo dpkg -r torplay
          test ! -e /usr/bin/torplay
          trap - EXIT
          rm -rf "$autostart_root"

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TorPlay-Linux-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.AppImage.sha256
            dist/linux/*.deb
            dist/linux/*.deb.sha256
            dist/linux/*.rpm
            dist/linux/*.rpm.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

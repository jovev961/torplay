name: Linux AppImage

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ubuntu 24.04 x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, lint, build, and package
        run: npm run release:linux

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist/linux
          sha256sum --check TorPlay-*.AppImage.sha256

      - name: Smoke-test bundled runtime without FUSE
        shell: bash
        run: node scripts/smoke-linux-appimage.js dist/linux/TorPlay-*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TorPlay-Linux-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

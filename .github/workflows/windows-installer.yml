name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      INNO_SETUP_VERSION: "7.1.0"
      INNO_SETUP_SHA256: "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-$env:INNO_SETUP_VERSION-x64.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup checksum mismatch: expected $env:INNO_SETUP_SHA256, received $actualHash."
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $compiler = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler was not installed at $compiler."
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read package metadata
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test, lint, build, and package installer
        run: npm run release:windows

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.package.outputs.version }}"
          $installer = "dist/windows/TorPlay-Setup-$version.exe"
          $checksum = "$installer.sha256"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer is missing: $installer"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Expected checksum is missing: $checksum"
          }

          $parts = (Get-Content -LiteralPath $checksum -Raw).Trim() -split "\s+", 2
          $expectedHash = $parts[0].ToLowerInvariant()
          $expectedName = if ($parts.Length -gt 1) { $parts[1].Trim() } else { "" }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerName = Split-Path -Leaf $installer
          if ($expectedHash -ne $actualHash -or $expectedName -ne $installerName) {
            throw "Generated installer checksum verification failed."
          }

          "### Windows installer" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- File: ``$installerName``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256: ``$actualHash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TorPlay-Windows-${{ steps.package.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/windows/TorPlay-Setup-${{ steps.package.outputs.version }}.exe
            dist/windows/TorPlay-Setup-${{ steps.package.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
